name: "evil-helix - check fork rebase"

on:
  push:
    branches: [main, feat-ci-check-fork-rebase] # TODO: remove feature branch
  schedule:
  - cron: "00 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-synchronization
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: fetch upstream
      run: |
        git remote add upstream https://github.com/helix-editor/helix.git
        git fetch upstream

    - name: rebase
      env:
        GIT_COMMITTER_NAME: dummy
        GIT_COMMITTER_EMAIL: dummy@email
      run: |
        git fetch upstream
        git rebase -x 'echo "-> Restoring" && git checkout --theirs -- README.md && echo "-> Adding" && git add README.md && echo "Restored fork-specific README.md" || echo "No further action needed"; git status' upstream/master
        # git rebase -x 'echo "-> Restoring" && git checkout --theirs -- README.md && echo "-> Adding" && git add README.md && echo "-> Continuing" && git rebase --continue && echo "Restored fork-specific README.md" || echo "No further action needed"; git status' upstream/master